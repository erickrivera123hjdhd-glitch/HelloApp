name: Build unsigned IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and package
        run: |
          xcodebuild -project HelloApp.xcodeproj -scheme HelloApp \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HelloApp.app Payload/
          zip -r HelloApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HelloApp-unsigned-ipa
          path: HelloApp.ipa
